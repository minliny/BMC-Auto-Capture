name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── macOS Runtime ────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build PyInstaller (runtime only, no src/config)
        run: |
          python -m PyInstaller \
            --onedir --name bmc-engine \
            --hidden-import paramiko \
            --hidden-import playwright \
            --hidden-import openpyxl \
            --hidden-import psutil \
            --hidden-import yaml \
            --hidden-import PIL \
            --hidden-import textual \
            --hidden-import rich \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import pydantic \
            --hidden-import aiofiles \
            --hidden-import python_multipart \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module pandas \
            --console \
            --noconfirm \
            run.py

      - name: Copy Chromium into dist
        run: |
          mkdir -p dist/bmc-engine/playwright_browsers
          cp -r ~/Library/Caches/ms-playwright/chromium-* dist/bmc-engine/playwright_browsers/
          cp -r ~/Library/Caches/ms-playwright/chromium_headless_shell-* dist/bmc-engine/playwright_browsers/ 2>/dev/null || true

      - name: Package runtime
        run: |
          mv dist/bmc-engine dist/runtime
          cd dist
          tar -czf bmc-runtime-${{ github.ref_name }}-macos-arm64.tar.gz runtime

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-arm64
          path: dist/bmc-runtime-${{ github.ref_name }}-macos-arm64.tar.gz

  # ── Windows Runtime ──────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build PyInstaller (runtime only, no src/config)
        run: |
          python -m PyInstaller `
            --onedir --name bmc-engine `
            --hidden-import paramiko `
            --hidden-import playwright `
            --hidden-import openpyxl `
            --hidden-import psutil `
            --hidden-import yaml `
            --hidden-import PIL `
            --hidden-import textual `
            --hidden-import rich `
            --hidden-import fastapi `
            --hidden-import uvicorn `
            --hidden-import pydantic `
            --hidden-import aiofiles `
            --hidden-import python_multipart `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module pandas `
            --console `
            --noconfirm `
            run.py

      - name: Copy Chromium into dist
        shell: cmd
        run: |
          if not exist dist\bmc-engine\playwright_browsers mkdir dist\bmc-engine\playwright_browsers
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium_headless_shell-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\ffmpeg-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          exit /b 0

      - name: Package runtime
        run: |
          ren dist\bmc-engine runtime
          cd dist
          7z a bmc-runtime-${{ github.ref_name }}-win-x64.7z runtime

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-win-x64
          path: dist/bmc-runtime-${{ github.ref_name }}-win-x64.7z

  # ── App package (cross-platform, lightweight) ────────────
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package app
        run: |
          mkdir -p dist/app
          cp -r src/ config/ examples/ tasks.json README.md dist/app/
          cp scripts/启动.bat dist/
          cd dist
          zip -r bmc-app-${{ github.ref_name }}.zip app/ 启动.bat \
            -x "*.pyc" "__pycache__/*"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: bmc-app-${{ github.ref_name }}.zip

  # ── Release ──────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            runtime-macos-arm64/*.tar.gz
            runtime-win-x64/*.7z
            app/*.zip
