name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Windows Build + Smoke Test ───────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build PyInstaller (runtime only, no src/config)
        run: |
          python -m PyInstaller `
            --onedir --name bmc-engine `
            --hidden-import paramiko `
            --hidden-import playwright `
            --hidden-import openpyxl `
            --hidden-import psutil `
            --hidden-import yaml `
            --hidden-import PIL `
            --hidden-import textual `
            --hidden-import rich `
            --hidden-import fastapi `
            --hidden-import uvicorn `
            --hidden-import pydantic `
            --hidden-import aiofiles `
            --hidden-import python_multipart `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module pandas `
            --console `
            --noconfirm `
            run.py

      - name: Copy Chromium into dist
        shell: cmd
        run: |
          if not exist dist\bmc-engine\playwright_browsers mkdir dist\bmc-engine\playwright_browsers
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium_headless_shell-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\ffmpeg-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          exit /b 0

      # ── Smoke test: verify the built exe can start ─────────
      - name: Prepare smoke test layout
        shell: cmd
        run: |
          REM Simulate user directory: runtime/ + app/
          mkdir dist\staging\runtime
          mkdir dist\staging\app
          REM Move PyInstaller output INTO runtime/ (bmc-engine.exe at runtime\)
          xcopy /E /I /Y dist\bmc-engine dist\staging\runtime >nul
          rd /s /q dist\bmc-engine
          REM Copy app files
          xcopy /E /I /Y src dist\staging\app\src >nul
          xcopy /E /I /Y config dist\staging\app\config >nul
          xcopy /E /I /Y examples dist\staging\app\examples >nul
          copy tasks.json dist\staging\app\ >nul
          echo Smoke test layout ready

      - name: Smoke test — engine help
        shell: cmd
        run: |
          cd dist\staging
          runtime\bmc-engine.exe --help
          if %ERRORLEVEL% NEQ 0 exit /b 1

      - name: Smoke test — preflight with bundled Excel
        shell: cmd
        run: |
          cd dist\staging
          runtime\bmc-engine.exe --app-dir app --excel app\examples\task_template.xlsx --preflight-only
          if %ERRORLEVEL% NEQ 0 exit /b 1

      # ── Package ──────────────────────────────────────────
      - name: Package runtime
        run: |
          cd dist\staging
          7z a ..\bmc-runtime-${{ github.ref_name }}-win-x64.7z runtime

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-win-x64
          path: dist/bmc-runtime-${{ github.ref_name }}-win-x64.7z
          if-no-files-found: error

  # ── App package (cross-platform, lightweight) ────────────
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package app
        run: |
          mkdir -p dist/app
          cp -r src/ config/ examples/ tasks.json README.md dist/app/
          cp scripts/start.bat scripts/start.ps1 dist/
          cd dist
          zip -r ../bmc-app-${{ github.ref_name }}.zip app/ start.bat start.ps1 -x "*.pyc" "__pycache__/*"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: bmc-app-${{ github.ref_name }}.zip

  # ── Release ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: find . -type f \( -name "*.7z" -o -name "*.zip" \) | sort

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'RC') }}
          files: |
            runtime-win-x64/*
            app/*
