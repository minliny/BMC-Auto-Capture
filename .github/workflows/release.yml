name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Windows Build + Smoke Test ───────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build PyInstaller (runtime only, no src/config)
        run: |
          python -m PyInstaller `
            --onedir --name bmc-auto-capture `
            --hidden-import paramiko `
            --hidden-import playwright `
            --hidden-import openpyxl `
            --hidden-import psutil `
            --hidden-import yaml `
            --hidden-import PIL `
            --hidden-import textual `
            --hidden-import rich `
            --hidden-import fastapi `
            --hidden-import uvicorn `
            --hidden-import pydantic `
            --hidden-import aiofiles `
            --hidden-import python_multipart `
            --hidden-import src.cli `
            --hidden-import src.cli.launcher `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module pandas `
            --console `
            --noconfirm `
            run.py

      - name: Copy Chromium into dist
        shell: cmd
        run: |
          if not exist dist\bmc-auto-capture\playwright_browsers mkdir dist\bmc-auto-capture\playwright_browsers
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium-*") do (
            robocopy "%%i" "dist\bmc-auto-capture\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium_headless_shell-*") do (
            robocopy "%%i" "dist\bmc-auto-capture\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\ffmpeg-*") do (
            robocopy "%%i" "dist\bmc-auto-capture\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          exit /b 0

      # ── Copy app files and launcher files ──────────────────
      - name: Copy app and launcher files
        shell: cmd
        run: |
          REM Copy src/ (包含 cli/launcher.py)
          xcopy /E /I /Y src dist\bmc-auto-capture\src >nul
          REM Copy config/
          xcopy /E /I /Y config dist\bmc-auto-capture\config >nul
          REM Copy examples/
          xcopy /E /I /Y examples dist\bmc-auto-capture\examples >nul
          REM Copy docs/LAUNCHER_USAGE.md
          copy docs\LAUNCHER_USAGE.md dist\bmc-auto-capture\ >nul
          REM Copy tasks.json
          copy tasks.json dist\bmc-auto-capture\ >nul
          REM Copy 启动.cmd
          copy 启动.cmd dist\bmc-auto-capture\ >nul
          echo App and launcher files copied

      # ── Smoke test: verify the built exe can start ─────────
      - name: Smoke test — engine help
        shell: cmd
        run: |
          cd dist\bmc-auto-capture
          bmc-auto-capture.exe --help
          if %ERRORLEVEL% NEQ 0 exit /b 1

      - name: Smoke test — launcher help
        shell: cmd
        run: |
          cd dist\bmc-auto-capture
          bmc-auto-capture.exe --launcher --help
          if %ERRORLEVEL% NEQ 0 exit /b 1

      - name: Smoke test — preflight with bundled Excel
        shell: cmd
        run: |
          cd dist\bmc-auto-capture
          bmc-auto-capture.exe --excel examples\task_template.xlsx --preflight-only
          if %ERRORLEVEL% NEQ 0 exit /b 1

      # ── Package Windows ─────────────────────────────────────
      - name: Package Windows
        run: |
          cd dist
          7z a bmc-auto-capture-win-x64.7z bmc-auto-capture/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmc-auto-capture-win-x64
          path: dist/bmc-auto-capture-win-x64.7z
          if-no-files-found: error

  # ── macOS Build ──────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build PyInstaller
        run: |
          python -m PyInstaller \
            --onedir --name bmc-auto-capture \
            --hidden-import paramiko \
            --hidden-import playwright \
            --hidden-import openpyxl \
            --hidden-import psutil \
            --hidden-import yaml \
            --hidden-import PIL \
            --hidden-import textual \
            --hidden-import rich \
            --hidden-import fastapi \
            --hidden-import uvicorn \
            --hidden-import pydantic \
            --hidden-import aiofiles \
            --hidden-import python_multipart \
            --hidden-import src.cli \
            --hidden-import src.cli.launcher \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module pandas \
            --console \
            run.py

      - name: Copy Chromium into dist
        run: |
          mkdir -p dist/bmc-auto-capture/playwright_browsers
          cp -r ~/Library/Caches/ms-playwright/chromium-* dist/bmc-auto-capture/playwright_browsers/ 2>/dev/null || true
          cp -r ~/Library/Caches/ms-playwright/chromium_headless_shell-* dist/bmc-auto-capture/playwright_browsers/ 2>/dev/null || true
          cp -r ~/Library/Caches/ms-playwright/ffmpeg-* dist/bmc-auto-capture/playwright_browsers/ 2>/dev/null || true

      - name: Copy app and launcher files
        run: |
          cp -r src/ dist/bmc-auto-capture/src/
          cp -r config/ dist/bmc-auto-capture/config/
          cp -r examples/ dist/bmc-auto-capture/examples/
          cp -r docs/LAUNCHER_USAGE.md dist/bmc-auto-capture/ 2>/dev/null || true
          cp tasks.json dist/bmc-auto-capture/
          cp 启动.cmd dist/bmc-auto-capture/ 2>/dev/null || true

      - name: Package macOS
        run: |
          cd dist
          tar -czf bmc-auto-capture-macos-arm64.tar.gz bmc-auto-capture/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmc-auto-capture-macos-arm64
          path: dist/bmc-auto-capture-macos-arm64.tar.gz
          if-no-files-found: error

  # ── Release ──────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: find . -type f \( -name "*.7z" -o -name "*.tar.gz" \) | sort

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'RC') }}
          files: |
            bmc-auto-capture-win-x64/*
            bmc-auto-capture-macos-arm64/*
