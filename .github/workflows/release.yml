name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Windows Build + Package ─────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build PyInstaller (runtime engine)
        run: |
          python -m PyInstaller `
            --onedir --name bmc-engine `
            --hidden-import paramiko `
            --hidden-import playwright `
            --hidden-import openpyxl `
            --hidden-import psutil `
            --hidden-import yaml `
            --hidden-import PIL `
            --hidden-import textual `
            --hidden-import rich `
            --hidden-import fastapi `
            --hidden-import uvicorn `
            --hidden-import pydantic `
            --hidden-import aiofiles `
            --hidden-import python_multipart `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module pandas `
            --console `
            --noconfirm `
            run.py

      - name: Copy Chromium browsers into runtime
        shell: cmd
        run: |
          if not exist dist\bmc-engine\playwright_browsers mkdir dist\bmc-engine\playwright_browsers
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium_headless_shell-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\ffmpeg-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          exit /b 0

      # ── Determine: release or pre-release ──────────────────
      - name: Set release type
        id: release-type
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "RC") {
            echo "IS_RC=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "IS_RC=false" >> $env:GITHUB_OUTPUT
          }

      # ── Build runtime (dependency) layer ─────────────────
      # Directory layout:
      #   runtime/
      #     bmc-engine.exe
      #     _internal/          ← Python + pip deps
      #     playwright_browsers/ ← Chromium
      # This layer changes only when pip deps or Chromium version change.

      - name: Assemble runtime (dependency) layer
        shell: cmd
        run: |
          mkdir runtime-layer
          copy dist\bmc-engine\bmc-engine.exe runtime-layer\ >nul
          xcopy /E /I /Y dist\bmc-engine\_internal runtime-layer\_internal >nul
          xcopy /E /I /Y dist\bmc-engine\playwright_browsers runtime-layer\playwright_browsers >nul
          echo [OK] runtime layer assembled: runtime-layer/

      - name: Package runtime (dependency) layer
        run: |
          7z a bmc-runtime-${{ github.ref_name }}-win-x64.7z runtime-layer

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-win-x64
          path: bmc-runtime-${{ github.ref_name }}-win-x64.7z
          if-no-files-found: error

      # ── Build app (script) layer ──────────────────────────
      # Directory layout (when extracted into project root):
      #   app/                 ← scripts + config + tasks
      #     src/
      #     config/
      #     examples/
      #     tasks.json
      #   run.py
      #   启动.bat
      # This layer changes every RC. User downloads, extracts into
      # project root (where runtime/ already lives from first install),
      # overwriting old app/ files.

      - name: Assemble app (script) layer
        shell: cmd
        run: |
          mkdir app-layer\app
          xcopy /E /I /Y src app-layer\app\src >nul
          xcopy /E /I /Y config app-layer\app\config >nul
          xcopy /E /I /Y examples app-layer\app\examples >nul
          copy tasks.json app-layer\app\ >nul

          REM Root-level launcher files
          copy run.py app-layer\ >nul
          for %%f in (*.bat) do copy "%%f" app-layer\ >nul

          REM Clean up __pycache__ to keep package small
          for /d /r app-layer %%d in (__pycache__) do @if exist "%%d" rd /s /q "%%d"

          echo [OK] app layer assembled: app-layer/

      - name: Package app (script) layer
        run: |
          7z a bmc-app-${{ github.ref_name }}.zip app-layer

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: bmc-app-${{ github.ref_name }}.zip
          if-no-files-found: error

      # ── Build full release (all-in-one, extract-and-run) ──
      # Final layout user sees:
      #   bmc-auto-capture/
      #     runtime/
      #       bmc-engine.exe
      #       _internal/
      #       playwright_browsers/
      #     app/
      #       src/ config/ examples/ tasks.json
      #     run.py
      #     启动.bat
      #     README.txt
      - name: Assemble full release directory
        shell: cmd
        run: |
          mkdir bmc-auto-capture\runtime
          mkdir bmc-auto-capture\app

          REM Runtime (dependency) layer
          xcopy /E /I /Y dist\bmc-engine\_internal bmc-auto-capture\runtime\_internal >nul
          xcopy /E /I /Y dist\bmc-engine\playwright_browsers bmc-auto-capture\runtime\playwright_browsers >nul
          copy dist\bmc-engine\bmc-engine.exe bmc-auto-capture\runtime\ >nul
          rd /s /q dist\bmc-engine

          REM App (script) layer
          xcopy /E /I /Y src bmc-auto-capture\app\src >nul
          xcopy /E /I /Y config bmc-auto-capture\app\config >nul
          xcopy /E /I /Y examples bmc-auto-capture\app\examples >nul
          copy tasks.json bmc-auto-capture\app\ >nul
          copy run.py bmc-auto-capture\ >nul
          for %%f in (*.bat) do copy "%%f" bmc-auto-capture\ >nul

          REM Clean up __pycache__
          for /d /r bmc-auto-capture %%d in (__pycache__) do @if exist "%%d" rd /s /q "%%d"

          REM README — copy as ASCII-safe filename to avoid codepage issues
          if exist README_RELEASE.md (
            copy README_RELEASE.md bmc-auto-capture\README.txt >nul
          )

          echo [OK] full release assembled: bmc-auto-capture/

      # ── Smoke tests ────────────────────────────────────────
      - name: Smoke test — engine help
        shell: cmd
        run: |
          cd bmc-auto-capture
          runtime\bmc-engine.exe --help
          if %ERRORLEVEL% NEQ 0 exit /b 1

      - name: Smoke test — preflight with bundled Excel
        shell: cmd
        run: |
          cd bmc-auto-capture
          runtime\bmc-engine.exe --app-dir app --excel app\examples\task_template.xlsx --preflight-only
          if %ERRORLEVEL% NEQ 0 exit /b 1

      - name: Package full release
        run: |
          7z a bmc-auto-capture-${{ github.ref_name }}-win-x64.zip bmc-auto-capture

      - name: Upload full release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: bmc-auto-capture-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  # ── Release ───────────────────────────────────────────────
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: find . -type f \( -name "*.7z" -o -name "*.zip" \) | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'RC') }}
          files: |
            release-win-x64/*
