name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual build"
        required: false
        default: "Manual rebuild"

jobs:
  # ── Windows Build + Package ─────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Pre-build cleanup (force fresh build)
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist
          echo [OK] Cleaned build/ and dist/

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Build PyInstaller (runtime engine)
        run: |
          python -m PyInstaller `
            --onedir --name bmc-engine `
            --hidden-import paramiko `
            --hidden-import playwright `
            --hidden-import openpyxl `
            --hidden-import psutil `
            --hidden-import yaml `
            --hidden-import PIL `
            --hidden-import textual `
            --hidden-import rich `
            --hidden-import fastapi `
            --hidden-import uvicorn `
            --hidden-import pydantic `
            --hidden-import aiofiles `
            --hidden-import python_multipart `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module pandas `
            --console `
            --noconfirm `
            run.py

      - name: Copy Chromium browsers into runtime
        shell: cmd
        run: |
          if not exist dist\bmc-engine\playwright_browsers mkdir dist\bmc-engine\playwright_browsers
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\chromium_headless_shell-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          for /d %%i in ("%USERPROFILE%\AppData\Local\ms-playwright\ffmpeg-*") do (
            robocopy "%%i" "dist\bmc-engine\playwright_browsers\%%~nxi" /E /NFL /NDL /NJH /NJS /nc /ns /np
            if %%ERRORLEVEL%% LEQ 1 (echo   OK) else (exit /b %%ERRORLEVEL%%)
          )
          exit /b 0

      # ── Determine: release or pre-release ──────────────────
      - name: Set release type
        id: release-type
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "RC") {
            echo "IS_RC=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "IS_RC=false" >> $env:GITHUB_OUTPUT
          }

      # ── Build runtime (dependency) layer ─────────────────
      # Directory layout:
      #   runtime/
      #     bmc-engine.exe
      #     _internal/          ← Python + pip deps
      #     playwright_browsers/ ← Chromium
      # This layer changes only when pip deps or Chromium version change.

      - name: Assemble runtime (dependency) layer
        shell: cmd
        run: |
          mkdir runtime
          copy dist\bmc-engine\bmc-engine.exe runtime\ >nul
          xcopy /E /I /Y dist\bmc-engine\_internal runtime\_internal >nul
          xcopy /E /I /Y dist\bmc-engine\playwright_browsers runtime\playwright_browsers >nul
          echo [OK] runtime layer assembled: runtime/

      - name: Generate build_info.json for runtime
        shell: cmd
        run: |
          python scripts\generate_build_info.py runtime ^
            --workflow "${{ github.workflow }}" ^
            --run-id "${{ github.run_id }}" ^
            --entrypoint run.py
          if %ERRORLEVEL% NEQ 0 exit /b 1
          echo [OK] build_info.json generated for runtime

      - name: Package runtime (dependency) layer
        run: |
          7z a bmc-runtime-${{ github.ref_name }}-win-x64.7z runtime

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-win-x64
          path: bmc-runtime-${{ github.ref_name }}-win-x64.7z
          if-no-files-found: error

      # ── Build app (script) layer ──────────────────────────
      # Directory layout (when extracted into project root):
      #   app/                 ← scripts + config + tasks
      #     src/
      #     config/
      #     examples/
      #     tasks.json
      #   run.py
      #   启动.bat
      # This layer changes every RC. User downloads, extracts into
      # project root (where runtime/ already lives from first install),
      # overwriting old app/ files.

      - name: Assemble app (script) layer
        shell: cmd
        run: |
          mkdir app-layer\app
          xcopy /E /I /Y src app-layer\app\src >nul
          xcopy /E /I /Y config app-layer\app\config >nul
          xcopy /E /I /Y examples app-layer\app\examples >nul
          xcopy /E /I /Y api app-layer\app\api >nul
          xcopy /E /I /Y assets app-layer\app\assets >nul
          copy tasks.json app-layer\app\ >nul

          REM Root-level launcher files
          copy run.py app-layer\ >nul
          for %%f in (*.bat) do copy "%%f" app-layer\ >nul

          REM Clean up __pycache__ to keep package small
          for /d /r app-layer %%d in (__pycache__) do @if exist "%%d" rd /s /q "%%d"

          echo [OK] app layer assembled: app-layer/

      - name: Package app (script) layer
        run: |
          7z a bmc-app-${{ github.ref_name }}.zip app-layer

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: bmc-app-${{ github.ref_name }}.zip
          if-no-files-found: error

      # ── Build full release (all-in-one, extract-and-run) ──
      # Only this zip is attached to every release (RC or official).
      # The runtime.7z and app.zip are internal build artifacts only.
      # Final layout after extraction:
      #   bmc-auto-capture/
      #     runtime/
      #       bmc-engine.exe
      #       _internal/
      #       playwright_browsers/
      #     app/
      #       src/ config/ examples/ tasks.json
      #     run.py
      #     启动.bat
      #     README.txt
      - name: Assemble full release directory
        shell: cmd
        run: |
          mkdir bmc-auto-capture\runtime
          mkdir bmc-auto-capture\app

          REM Runtime (dependency) layer
          xcopy /E /I /Y dist\bmc-engine\_internal bmc-auto-capture\runtime\_internal >nul
          xcopy /E /I /Y dist\bmc-engine\playwright_browsers bmc-auto-capture\runtime\playwright_browsers >nul
          copy dist\bmc-engine\bmc-engine.exe bmc-auto-capture\runtime\ >nul
          rd /s /q dist\bmc-engine

          REM App (script) layer
          xcopy /E /I /Y src bmc-auto-capture\app\src >nul
          xcopy /E /I /Y config bmc-auto-capture\app\config >nul
          xcopy /E /I /Y examples bmc-auto-capture\app\examples >nul
          xcopy /E /I /Y api bmc-auto-capture\app\api >nul
          xcopy /E /I /Y assets bmc-auto-capture\app\assets >nul
          copy tasks.json bmc-auto-capture\app\ >nul
          copy run.py bmc-auto-capture\ >nul
          for %%f in (*.bat) do copy "%%f" bmc-auto-capture\ >nul

          REM Scripts (CLI + API server)
          mkdir bmc-auto-capture\scripts
          copy scripts\start_executor_api_server.py bmc-auto-capture\scripts\ >nul
          copy scripts\submit_plan_run.py bmc-auto-capture\scripts\ >nul
          copy scripts\mock_plan_status_server.py bmc-auto-capture\scripts\ >nul
          copy scripts\submit_direct_job.py bmc-auto-capture\scripts\ >nul
          copy scripts\build_plan_manifest.py bmc-auto-capture\scripts\ >nul
          copy scripts\mock_callback_server.py bmc-auto-capture\scripts\ >nul
          copy scripts\smoke_executor_runtime.ps1 bmc-auto-capture\scripts\ >nul

          REM Clean up __pycache__
          for /d /r bmc-auto-capture %%d in (__pycache__) do @if exist "%%d" rd /s /q "%%d"

          REM README — copy as ASCII-safe filename to avoid codepage issues
          if exist README_RELEASE.md (
            copy README_RELEASE.md bmc-auto-capture\README.txt >nul
          )

          echo [OK] full release assembled: bmc-auto-capture/

      # ── Generate build metadata ───────────────────────────
      - name: Generate build_info.json
        shell: cmd
        run: |
          python scripts\generate_build_info.py bmc-auto-capture\runtime ^
            --workflow "Build & Release" ^
            --run-id "%GITHUB_RUN_ID%" ^
            --entrypoint run.py
          if %ERRORLEVEL% NEQ 0 exit /b 1
          echo [OK] build_info.json generated

      # ── Smoke tests ────────────────────────────────────────
      - name: Smoke test — help has --preflight-auth
        shell: cmd
        run: |
          cd bmc-auto-capture
          runtime\bmc-engine.exe --help | findstr "preflight-auth"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] --preflight-auth not found in exe --help
            exit /b 1
          )
          echo [OK] --preflight-auth IS present in exe --help

      - name: Smoke test — help has all required flags
        shell: cmd
        run: |
          cd bmc-auto-capture
          setlocal enabledelayedexpansion
          set FAILED=0
          for %%f in (preflight-only no-preflight server mode max-bmc-workers max-ssh-workers bmc-page-timeout) do (
            runtime\bmc-engine.exe --help | findstr "%%f" >nul
            if !ERRORLEVEL! NEQ 0 (
              echo [FAIL] Flag "%%f" not found in exe --help
              set FAILED=1
            )
          )
          if !FAILED! EQU 1 exit /b 1
          echo [OK] All required flags present in exe --help

      - name: Smoke test — preflight-auth invalid choice
        shell: cmd
        run: |
          cd bmc-auto-capture
          set ERR=0
          runtime\bmc-engine.exe --excel app\examples\task_template.xlsx --preflight-auth invalid >nul 2>&1
          if %ERRORLEVEL% EQU 0 (
            echo [FAIL] --preflight-auth invalid should return non-zero
            set ERR=1
          ) else (
            echo [OK] --preflight-auth invalid correctly returns non-zero
          )
          if %ERR% EQU 1 exit /b 1
          exit /b 0

      - name: Smoke test — preflight with bundled Excel (no real devices)
        shell: cmd
        run: |
          cd bmc-auto-capture
          runtime\bmc-engine.exe --app-dir app --excel app\examples\task_template.xlsx --preflight-only
          if %ERRORLEVEL% NEQ 0 exit /b 1
          echo [OK] Preflight-only smoke test passed

      - name: Verify build_info.json
        shell: cmd
        run: |
          if not exist bmc-auto-capture\runtime\build_info.json (
            echo [FAIL] build_info.json not found
            exit /b 1
          )
          type bmc-auto-capture\runtime\build_info.json
          echo [OK] build_info.json present

      - name: Smoke test — API server scripts present
        shell: cmd
        run: |
          set ERR=0
          if not exist bmc-auto-capture\scripts\start_executor_api_server.py (
            echo [FAIL] start_executor_api_server.py missing
            set ERR=1
          )
          if not exist bmc-auto-capture\scripts\submit_plan_run.py (
            echo [FAIL] submit_plan_run.py missing
            set ERR=1
          )
          if not exist bmc-auto-capture\app\src\executor_api_server (
            echo [FAIL] src\executor_api_server missing
            set ERR=1
          )
          if not exist bmc-auto-capture\app\src\plan_run_service (
            echo [FAIL] src\plan_run_service missing
            set ERR=1
          )
          if not exist bmc-auto-capture\app\src\plan_item_status_callback_client (
            echo [FAIL] src\plan_item_status_callback_client missing
            set ERR=1
          )
          if not exist bmc-auto-capture\scripts\smoke_executor_runtime.ps1 (
            echo [FAIL] smoke_executor_runtime.ps1 missing
            set ERR=1
          )
          if %ERR% EQU 1 exit /b 1
          echo [OK] All API server files present

      - name: Smoke test — API server starts and has routes (via exe)
        shell: cmd
        run: |
          cd bmc-auto-capture
          set EXECUTOR_PORT=18000
          REM Start API server in background using exe directly (no Python)
          start "executor-api" /B runtime\bmc-engine.exe --server --host 127.0.0.1 --port %EXECUTOR_PORT% --runner fake --callback-transport fake --executor-id ci-smoke --enable-debug-callback-receiver
          REM Wait for startup
          timeout /t 8 /nobreak >nul
          REM Check /executor/v1/status
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/executor/v1/status | findstr "executor_id"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] /executor/v1/status not reachable
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          REM Check openapi routes
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/openapi.json | findstr "executor/v1/status"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] executor/v1/status not in openapi routes
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/openapi.json | findstr "executor/v1/config/excel:path"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] config/excel:path not in openapi routes
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/openapi.json | findstr "executor/v1/plans"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] executor/v1/plans not in openapi routes
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )

      - name: Smoke test — debug callback receiver routes
        shell: cmd
        run: |
          cd bmc-auto-capture
          set EXECUTOR_PORT=18000
          REM Verify debug callback receiver routes
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/openapi.json | findstr "debug/plan-item-statuses"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] debug/plan-item-statuses not in openapi routes
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          REM POST a test callback
          curl -s -X POST http://127.0.0.1:%EXECUTOR_PORT%/debug/plan-item-statuses -H "Content-Type: application/json" -d "{\"planId\":1,\"deviceName\":\"D1\",\"taskName\":\"T1\",\"status\":\"SUCCESS\",\"updater\":\"ci-test\",\"errorMessage\":null}" | findstr "ok"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] Debug POST failed
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          REM GET stored callbacks
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/debug/plan-item-statuses | findstr "planId"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] Debug GET failed to show received callbacks
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          REM DELETE and verify cleared
          curl -s -X DELETE http://127.0.0.1:%EXECUTOR_PORT%/debug/plan-item-statuses | findstr "cleared"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] Debug DELETE failed
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          REM Verify cleared
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/debug/plan-item-statuses | findstr "\"total\": 0"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] Debug store not empty after DELETE
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          echo [OK] Debug callback receiver smoke test passed

      - name: Smoke test — legacy Network Boot is NOT the default
        shell: cmd
        run: |
          cd bmc-auto-capture
          set EXECUTOR_PORT=18001
          REM Start server WITHOUT --legacy-network-boot — must start Executor API
          start "executor-api" /B runtime\bmc-engine.exe --server --host 127.0.0.1 --port %EXECUTOR_PORT% --runner fake --callback-transport fake
          timeout /t 5 /nobreak >nul
          REM Check Executor API route, NOT just legacy /network/ping
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/executor/v1/status | findstr "executor_id"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] Default server mode does NOT start Executor API
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          REM Verify it has plan run routes (not just legacy ping)
          curl -s http://127.0.0.1:%EXECUTOR_PORT%/openapi.json | findstr "executor/v1/config/excel:path"
          if %ERRORLEVEL% NEQ 0 (
            echo [FAIL] Plan run routes not present in default server mode
            taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
            exit /b 1
          )
          taskkill /f /fi "WINDOWTITLE eq executor-api*" >nul 2>&1
          echo [OK] Default server mode correctly starts Executor API (not legacy Network Boot)

      - name: Package full release
        run: |
          7z a bmc-auto-capture-${{ github.ref_name }}-win-x64.zip bmc-auto-capture

      - name: Upload full release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: bmc-auto-capture-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  # ── Release ───────────────────────────────────────────────
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: find . -type f \( -name "*.7z" -o -name "*.zip" \) | sort

      - name: Publish RC release
        if: contains(github.ref_name, 'RC')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: true
          files: |
            runtime-win-x64/*
            app/*

      - name: Publish standard release
        if: ${{ !contains(github.ref_name, 'RC') }}
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: false
          files: |
            release-win-x64/*
