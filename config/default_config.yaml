# BMC Auto-Capture v0.2.5rc3 — Default Configuration
# All values can be overridden per deployment.

# --- Worker pool sizing ---
max_bmc_workers: 4
max_ssh_workers: 8
base_bmc_workers: 2
base_ssh_workers: 4

# --- Resource thresholds for dynamic scaling ---
cpu_scale_down_pct: 90.0
mem_scale_down_pct: 85.0
cpu_scale_up_pct: 60.0
mem_scale_up_pct: 50.0
cpu_emergency_pct: 95.0
mem_emergency_pct: 92.0
resource_check_interval: 5.0

# --- Dynamic scaling coefficients ---
resource_scale_emergency: 0.3
resource_scale_down: 0.6
resource_scale_up: 1.3
resource_scale_normal: 1.0

# --- Browser lifecycle ---
browser_max_tasks_before_recycle: 50
browser_max_age_seconds: 1800
browser_headless: true

# --- Connectivity preflight ---
tcp_connect_timeout: 5.0

# --- Per-protocol timeouts ---
ssh_command_timeout: 60.0
ssh_idle_timeout: 5.0
bmc_page_timeout: 60.0
popup_dismiss_selector_timeout: 1000

# BMC artifact profile:
#   full: PNG + HTML + evidence.html + MHTML + state JSON (default, complete evidence)
#   fast: PNG + HTML only (explicit opt-in for faster field runs)
bmc_artifact_profile: "full"

# --- Preflight ---
preflight_enabled: true
route_guard_enabled: true
route_guard_check_interval: 30.0

# --- Output ---
output_root: "./output"

# --- API ---
api_host: "0.0.0.0"
api_port: 8080
